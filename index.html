<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Engine</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1>Football Engine</h1>
    <p>Football reasoning engine prototype</p>
  </header>

  <main id="app">
    <div class="controls">
      <label for="offense">Offense</label>
      <select id="offense"></select>

      <label for="defense">Defense</label>
      <select id="defense"></select>

      <button id="run-play">Run Play</button>
    </div>

    <hr>

    <section class="results">
      <h2>Result</h2>

      <p><strong>Gain:</strong> <span id="gain">-</span></p>

      <p><strong>Commentary:</strong></p>
      <p id="commentary">Run a play to begin.</p>
    </section>
  </main>

  <script type="module" src="app.js"></script>

</body>

</html>
